<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Tickets FISI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: #f3f5f9;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #d1d5db;
        --primary: #1d4ed8;
        --primary-hover: #1e40af;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family:
          system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 1.5rem 1rem;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
      }
      h2 {
        text-align: center;
        font-size: 1.4rem;
        margin: 0 0 1.25rem;
      }
      .card {
        background: var(--card);
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      }
      .card[hidden] {
        display: none;
      }
      label {
        display: block;
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 0.3rem;
      }
      input,
      select,
      textarea,
      button {
        display: block;
        width: 100%;
        font: inherit;
        padding: 0.65rem 0.75rem;
        margin: 0 0 1rem;
      }
      input,
      select,
      textarea {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
        color: var(--text);
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid var(--primary);
        outline-offset: 0;
        border-color: transparent;
      }
      button {
        border: none;
        border-radius: 8px;
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover {
        background: var(--primary-hover);
      }
      button.secundario {
        background: #e5e7eb;
        color: var(--text);
      }
      button.secundario:hover {
        background: #d1d5db;
      }
      .fila {
        display: flex;
        gap: 0.75rem;
      }
      .fila > div {
        flex: 1;
      }
      pre {
        background: var(--bg);
        border-radius: 8px;
        padding: 0.75rem;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 0.9rem;
      }
      #msg {
        text-align: center;
        font-weight: 600;
      }
      p {
        color: var(--muted);
        margin-top: 0;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
  </head>
  <body>
    <main>
      <h2>Reporte de incidencias – FISI</h2>

      <div id="login" class="card">
        <label for="email">Correo</label>
        <input id="email" type="email" placeholder="docente@unmsm.edu.pe" />
        <label for="pass">Contraseña</label>
        <input id="pass" type="password" placeholder="••••••••" />
        <button onclick="login()">Iniciar sesión</button>
      </div>

      <div id="form" class="card" hidden>
        <div class="fila">
          <div>
            <label for="pabellon">Pabellón</label>
            <select id="pabellon">
              <option value="" disabled selected>Elegir…</option>
              <option value="Nuevo pabellón">Nuevo pabellón</option>
              <option value="Antiguo pabellón">Antiguo pabellón</option>
            </select>
          </div>
          <div>
            <label for="laboratorio">Laboratorio</label>
            <select id="laboratorio">
              <option value="" disabled selected>Elegir…</option>
              <option>1</option>
              <option>2</option>
              <option>3</option>
              <option>4</option>
              <option>5</option>
              <option>6</option>
              <option>7</option>
              <option>8</option>
            </select>
          </div>
        </div>

        <label for="categoria">Equipo con falla</label>
        <select id="categoria" onchange="cambiarCategoria()">
          <option value="pantalla">Pantalla interactiva</option>
          <option value="proyector">Proyector</option>
        </select>

        <label id="lbl" for="detalle"></label>
        <textarea id="detalle" rows="3"></textarea>
        <button onclick="resumir()">Ver resumen</button>
      </div>

      <div id="resumen" class="card" hidden>
        <p>Esto es lo que se registrará:</p>
        <pre id="txt"></pre>
        <button onclick="confirmar()">Confirmar</button>
        <button class="secundario" onclick="descartar()">Descartar</button>
      </div>

      <div id="fin" class="card" hidden>
        <p id="msg"></p>
        <button onclick="ver('form')">Nuevo reporte</button>
      </div>
    </main>

    <script>
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const $ = (id) => document.getElementById(id);
      const ver = (id) =>
        ['login', 'form', 'resumen', 'fin'].forEach(
          (s) => ($(s).hidden = s !== id),
        );
      const CAMPO = {
        pantalla:
          '¿Qué falla tiene la pantalla? (sin imagen, no responde al tacto...)',
        proyector: '¿Qué falla tiene el proyector? (no enciende, sin señal...)',
      };
      let token = null,
        borrador = null;

      function cambiarCategoria() {
        $('lbl').textContent = CAMPO[$('categoria').value];
      }
      cambiarCategoria();

      async function login() {
        const { data, error } = await sb.auth.signInWithPassword({
          email: $('email').value,
          password: $('pass').value,
        });
        if (error) return alert(error.message);
        token = data.session.access_token;
        ver('form');
      }
      function resumir() {
        if (!$('pabellon').value || !$('laboratorio').value)
          return alert('Elige el pabellón y el laboratorio.');
        borrador = {
          pabellon: $('pabellon').value,
          laboratorio: $('laboratorio').value,
          categoria: $('categoria').value,
          detalle: $('detalle').value,
        };
        $('txt').textContent = JSON.stringify(borrador, null, 2);
        ver('resumen');
      }
      async function confirmar() {
        const r = await fetch('/api/tickets', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + token,
          },
          body: JSON.stringify(borrador),
        });
        const d = await r.json();
        $('msg').textContent = r.ok
          ? `Ticket #${d.id} registrado. Soporte será notificado.`
          : 'Error: ' + JSON.stringify(d);
        ver('fin');
      }
      function descartar() {
        borrador = null;
        $('msg').textContent = 'Reporte descartado. No se registró nada.';
        ver('fin');
      }
    </script>
  </body>
</html>
